<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolyom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    header { background: #2c3e50; color: white; padding: 40px 20px; text-align: center; }
    main { padding: 20px; max-width: 1000px; margin: 0 auto; }
    h2 { margin: 20px 0 10px; }
    .kartlar { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .kart { background: #f4f6f8; padding: 20px; border-radius: 10px; }

    @media (min-width: 700px) {
      .kartlar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rabia</h1>
    <p>Merhaba, ben Rabia. Portfolyoma hoş geldin.</p>
  </header>
  <main>
    <h2>Hakkımda</h2>
    <p>Buraya kendini kısaca tanıtan bir yazı yazabilirsin.</p>

    <h2>Projelerim</h2>
    <div class="kartlar">
      <div class="kart">Proje 1</div>
      <div class="kart">Proje 2</div>
    </div>

    <h2>İletişim</h2>
    <p>E-posta: senin@mailin.com</p>
  </main>
</body>
</html>
