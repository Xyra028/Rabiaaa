<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd3e0">
<title>Rabiaaaa 🦦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Caveat','Bradley Hand','Segoe Print',cursive;
  color:#5a2a3c;background:#ffd3e0;
  background-image:radial-gradient(#ffbdd1 1.6px,transparent 1.8px);background-size:22px 22px;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.st{position:fixed;z-index:1;transform:rotate(var(--r));pointer-events:none;line-height:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

.card{
  position:relative;z-index:2;width:100%;max-width:340px;text-align:center;
  padding:38px 22px 30px;background:#fffaf4;border:2.5px solid #5a2a3c;
  border-radius:6px 14px 8px 12px;box-shadow:6px 7px 0 rgba(90,42,60,.9);
  transform:rotate(-1.5deg);
}
.card::before{ /* bant */
  content:"";position:absolute;top:-15px;left:50%;width:96px;height:30px;margin-left:-48px;
  background:rgba(255,141,176,.75);transform:rotate(2.5deg);
  border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6);
}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-1.5deg) translateX(-8px)}40%{transform:rotate(-1.5deg) translateX(8px)}60%{transform:rotate(-1.5deg) translateX(-5px)}80%{transform:rotate(-1.5deg) translateX(5px)}}

h1{font-size:42px;line-height:1;margin:0 0 10px;font-weight:700}
.nm{text-decoration:underline wavy #ff5d8f;text-decoration-thickness:2px;text-underline-offset:7px}
.card.win h1{font-size:36px;color:#e8346f;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.msg{min-height:54px;font-size:26px;line-height:1.1;margin:0 0 16px;font-weight:600}

.btns{display:flex;justify-content:center;align-items:center;gap:18px;min-height:70px}
button{font:inherit;cursor:pointer;color:#5a2a3c;border:2.5px solid #5a2a3c}
#yes{
  padding:6px 30px 8px;font-size:34px;font-weight:700;background:#ff6f9c;color:#fff;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:4px 5px 0 #5a2a3c;
  transition:transform .3s;animation:wig 1.6s ease-in-out infinite;position:relative;z-index:6;
}
@keyframes wig{0%,100%{rotate:-2deg}50%{rotate:2deg}}
#no{
  padding:4px 16px 6px;font-size:24px;font-weight:600;background:#e4e4ea;color:#767684;border-color:#8a8a98;
  border-radius:18px 255px 18px 225px/225px 18px 255px 18px;z-index:5;
  transition:left .38s cubic-bezier(.3,1.4,.5,1),top .38s cubic-bezier(.3,1.4,.5,1),transform .3s;
}
.win .btns{display:none}
@media (prefers-reduced-motion:reduce){#yes{animation:none}}

/* ---- Giriş ekranı ---- */
#prop{display:none}
#intro{position:fixed;inset:0;z-index:10;transition:opacity .45s}
#intro.out{opacity:0;pointer-events:none}
#zc{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{
  position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;margin:0 auto;width:min(88vw,340px);
  padding:10px 16px 12px;text-align:center;font-size:26px;line-height:1.05;font-weight:600;
  background:#fffaf4;border:2.5px solid #5a2a3c;border-radius:8px 14px 8px 12px;
  box-shadow:4px 5px 0 rgba(90,42,60,.9);transform:rotate(-1deg);pointer-events:none;
}
.chip.msg{
  font-size:35px;line-height:1.05;font-weight:700;color:#5a2a3c;padding:16px 18px 18px;
  border-width:3px;box-shadow:6px 7px 0 rgba(90,42,60,.9);animation:cpop .6s cubic-bezier(.3,1.6,.5,1);
}
@keyframes cpop{from{transform:rotate(-1deg) scale(.4);opacity:0}}
#go{
  position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
  padding:4px 20px 6px;font-size:26px;font-weight:700;background:#fffaf4;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 4px 0 #5a2a3c;
}
</style>
</head>
<body>
<div id="prop">
<span class="st" style="left:5%;top:4%;font-size:56px;--r:-14deg">🦦</span>
<span class="st" style="right:7%;top:6%;font-size:34px;--r:12deg">🌸</span>
<span class="st" style="left:6%;bottom:5%;font-size:44px;--r:10deg">💗</span>
<span class="st" style="right:5%;bottom:4%;font-size:70px;--r:-8deg">🦦</span>
<span class="st" style="left:30%;bottom:2%;font-size:38px;--r:18deg">🦦</span>
<canvas id="fx"></canvas>

<main class="card" id="card">
  <h1 id="title"><span class="nm">Rabia</span>, benimle çıkar mısın?</h1>
  <p class="msg" id="msg">bi düşün ama çok düşünme 🦦</p>
  <div class="btns">
    <button id="yes">Evet</button>
    <button id="no">Hayır 😔😔😔</button>
  </div>
</main>
</div>

<section id="intro">
  <canvas id="zc"></canvas>
  <div class="chip" id="chip"></div>
  <button id="go">tekrar düşünürsen </button>
</section>

<script>
const $ = id => document.getElementById(id);
const card = $('card'), yes = $('yes'), no = $('no'), msg = $('msg');
let n = 0, won = false;

const M = [
  "emin misin? 😔😔",
  "ya hadi hadi",
  "sevmeyi denesen belki olur",
  "sevebilirsin bence",
  "darlamam söz",
  "yanlış butona nasıl bu kadar çok basabilirsin",
  "evet sol tarafta"
];

let ys = 1; 


function bounds() {
  const w = no.offsetWidth, h = no.offsetHeight;
  return { w, h, minX: 12, maxX: Math.max(12, innerWidth - w - 12), minY: 30, maxY: Math.max(30, innerHeight - h - 36) };
}

function moveNo() {
  const b = bounds();
  if (no.parentNode !== document.body) {
    
    //
    const r = no.getBoundingClientRect();
    no.style.position = 'fixed';
    no.style.left = (r.left + r.width / 2 - b.w / 2) + 'px';
    no.style.top = (r.top + r.height / 2 - b.h / 2) + 'px';
    const row = no.parentNode, ph = document.createElement('span');
    ph.style.width = b.w + 'px';   // Hayır gidince Evet sol tarafta kalsın
    row.appendChild(ph);
    document.body.appendChild(no);
    void no.offsetWidth;
  }
  // 
  const yr = yes.getBoundingClientRect();
  const yx = yr.left + yr.width / 2, yy = yr.top + yr.height / 2;
  const yw = yes.offsetWidth * ys / 2 + 20, yh = yes.offsetHeight * ys / 2 + 20;
  const curX = parseFloat(no.style.left), curY = parseFloat(no.style.top);
  let best = null, bestD = -1;
  for (let i = 0; i < 50; i++) {
    const x = b.minX + Math.random() * (b.maxX - b.minX);
    const t = b.minY + Math.random() * (b.maxY - b.minY);
    const clear = x + b.w < yx - yw || x > yx + yw || t + b.h < yy - yh || t > yy + yh;
    const far = Math.hypot(x - curX, t - curY) > 90;
    if (clear && far) { best = { x, t }; break; }
    const d = Math.hypot(x + b.w / 2 - yx, t + b.h / 2 - yy);
    if (clear && d > bestD) { best = { x, t }; bestD = d; }
  }
  if (!best) best = { x: yx < innerWidth / 2 ? b.maxX : b.minX, t: b.minY };
  no.style.left = best.x + 'px';
  no.style.top = best.t + 'px';
}

// Ekran dönerse / boyut değişirse buton dışarıda kalmasın
addEventListener('resize', () => {
  if (no.parentNode !== document.body || won) return;
  const b = bounds();
  no.style.left = Math.min(Math.max(parseFloat(no.style.left), b.minX), b.maxX) + 'px';
  no.style.top = Math.min(Math.max(parseFloat(no.style.top), b.minY), b.maxY) + 'px';
});

no.addEventListener('click', () => {
  if (won) return;
  n++;
  msg.textContent = n <= M.length ? M[n - 1] : M[M.length - 3 + ((n - M.length - 1) % 3)];
  if (n >= 4) no.textContent = 'Hayır 😭';
  ys = Math.min(1 + n * 0.1, 1.5);
  yes.style.transform = `scale(${ys})`;
  no.style.transform = `scale(${Math.max(1 - n * 0.04, 0.72)})`;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  if (navigator.vibrate) navigator.vibrate(40);
  if (n >= 2) moveNo();   // 2. tıktan sonra kaçmaya başlar
});

// ---- Kutlama ----
const cv = $('fx'), cx = cv.getContext('2d');
let W, H, D, P = [], running = false;
function rs() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0); }
addEventListener('resize', rs); rs();
const COL = ['#ff5c8a', '#ff9fc0', '#ffffff', '#ffd54f', '#c9a7ff', '#ff7aa8'], EM = ['🦦', '💖', '🌸', '✨', '🦦', '💕', '🎉'];
function add(x, y, vx, vy) {
  const e = Math.random() < .3;
  P.push({ x, y, vx, vy, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    s: e ? 20 + Math.random() * 14 : 7 + Math.random() * 7,
    e: e ? EM[Math.random() * EM.length | 0] : 0, c: COL[Math.random() * COL.length | 0] });
}
function burst() {
  for (let i = 0; i < 80; i++) {
    const L = i % 2 === 0, a = L ? -1.4 + Math.random() * .7 : -1.74 - Math.random() * .7, v = 11 + Math.random() * 10;
    add(L ? 0 : W, H, Math.cos(a) * v, Math.sin(a) * v);
  }
}
function tick() {
  cx.clearRect(0, 0, W, H);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.vy = (p.vy + .2) * .985; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    if (p.y > H + 40) { P.splice(i, 1); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    if (p.e) { cx.font = p.s + 'px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.e, 0, 0); }
    else { cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
    cx.restore();
  }
  requestAnimationFrame(tick);
}

yes.addEventListener('click', () => {
  if (won) return;
  won = true;
  no.style.display = 'none';
  card.classList.add('win');
  $('title').textContent = 'SONUNDAA BİLİYORDUM EVETT DİYECEĞİNİ! 🎉';
  msg.textContent = 'PİŞMAN ETMİCEM SÖZZZ';
  if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
  burst();
  if (!running) { running = true; tick(); }
  let k = 0;
  const rain = setInterval(() => {
    for (let i = 0; i < 3; i++) add(Math.random() * W, -20, (Math.random() - .5) * 3, Math.random() * 2);
    if (++k % 25 === 0) burst();
    if (k > 140) clearInterval(rain);
  }, 70);
  document.body.addEventListener('click', e => { if (e.target !== yes) burst(); });
});
</script>
<script>
// ---- Giriş: 4 milyar kırmızı kare ve parlayan pembe olan ----
(() => {
  const cv = document.getElementById('zc'), g = cv.getContext('2d'), chip = document.getElementById('chip');
  const Z0 = 7, F = Math.pow(220 / 7, 1 / 6);          // 6 dokunuşta 7px -> 220px kare
  const T = [0, .4, .65, .82, .93, .98, 1];            // kameranın hedefe kayma oranı
  const TX = 12.5, TY = -21.5;                         // pembe karenin yeri
  const CAP = [
    "4 milyar kadın <br> ama sadece birisi parlıyor <br>dokunup yaklaşş",
    "abo", "az kaldı", "idris baba gel artık", "az kaldı", "abo",
    "GELDİKK<br>TIKLAA"
  ];
  const HE = ['💗', '💖', '💕', '💞'], HP = [];
  let W, H, D, s = 0, k = 0, from = 0, to = 0, t0 = 0, anim = false, arrive = -1, done = false, on = true, last = 0;

  function rs() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0); }
  addEventListener('resize', rs); rs();

  const hs = (i, j) => { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  function spawn(big) {
    const a = Math.random() * 6.283, v = big ? 1.5 + Math.random() * 4 : .6 + Math.random() * 1.4;
    HP.push({ x: W / 2 + Math.cos(a) * 30, y: H / 2 + Math.sin(a) * 30, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .6,
      s: 20 + Math.random() * 22, e: HE[Math.random() * 4 | 0], l: 1 });
  }
  const burst = () => { for (let i = 0; i < 7; i++) spawn(true); };
  chip.innerHTML = CAP[0];

  function loop(now) {
    g.clearRect(0, 0, W, H);
    if (anim) {
      const p = Math.min((now - t0) / 800, 1), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      s = from + (to - from) * e;
      if (p >= 1) { anim = false; s = k = to; chip.innerHTML = CAP[k]; if (k === 6) { arrive = now; burst(); } }
    }
    const a = Math.floor(s), b = Math.min(a + 1, 6), Tf = T[a] + (T[b] - T[a]) * (s - a);
    const cx = TX * Tf, cy = TY * Tf, z = Z0 * Math.pow(F, s), sq = z * .8, off = z * .1;
    const i0 = Math.floor(cx - W / 2 / z), i1 = Math.ceil(cx + W / 2 / z), j0 = Math.floor(cy - H / 2 / z), j1 = Math.ceil(cy + H / 2 / z);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      if (i === 12 && j === -22) continue;   // pembe kare aşağıda ayrıca çiziliyor
      const h = hs(i, j); g.fillStyle = `hsl(${352 + h * 10},${70 + h * 15}%,${40 + h * 14}%)`;
      g.fillRect(W / 2 + (i - cx) * z + off, H / 2 + (j - cy) * z + off, sq, sq);
    }
    // pembe kare + sadece ışık dalgası (çevresindeki kareler parlamıyor)
    const tx = W / 2 + (TX - cx) * z, ty = H / 2 + (TY - cy) * z;
    let ga = 1;
    if (arrive >= 0) { const q = (now - arrive) / 2800; ga = q < .2 ? 1 + q * 2 : Math.max(0, 1.4 * (1 - (q - .2) / .8)); }
    if (ga > 0) {
      const rmax = Math.min(20 * z, Math.max(W, H) * .75), lw = Math.max(3, z * .3);
      for (let n = 0; n < 2; n++) {
        const q = (now / 2400 + n * .5) % 1, r = q * rmax, al = Math.min(ga, 1) * (1 - q) * (1 - q);
        g.strokeStyle = `rgba(255,150,195,${.3 * al})`; g.lineWidth = lw * 3; g.beginPath(); g.arc(tx, ty, r, 0, 6.283); g.stroke();
        g.strokeStyle = `rgba(255,240,247,${.9 * al})`; g.lineWidth = lw; g.beginPath(); g.arc(tx, ty, r, 0, 6.283); g.stroke();
      }
    }
    const ps = Math.max(z * .92, 9);
    g.fillStyle = '#ff4f8b'; g.strokeStyle = '#fffaf4'; g.lineWidth = Math.max(1.5, z * .03);
    g.fillRect(tx - ps / 2, ty - ps / 2, ps, ps); g.strokeRect(tx - ps / 2, ty - ps / 2, ps, ps);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (z > 80) {
      g.font = `bold ${z * .5}px Caveat, cursive`;
      g.lineWidth = z * .03; g.strokeStyle = '#5a2a3c'; g.fillStyle = '#fffaf4';
      g.strokeText('28', tx, ty); g.fillText('28', tx, ty);
    }
    // kalpler
    if (arrive >= 0 && now - last > 1100 && HP.length < 12) { spawn(false); last = now; }
    for (let i = HP.length - 1; i >= 0; i--) {
      const p = HP[i]; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy = p.vy * .985 - .02; p.l -= .0065;
      if (p.l <= 0) { HP.splice(i, 1); continue; }
      g.globalAlpha = Math.min(p.l * 2, 1); g.font = p.s + 'px serif'; g.fillText(p.e, p.x, p.y);
    }
    g.globalAlpha = 1;
    if (on) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  cv.addEventListener('click', () => {
    if (anim || done) return;
    if (navigator.vibrate) navigator.vibrate(15);
    if (k < 6) { from = k; to = k + 1; t0 = performance.now(); anim = true; }
    else {
      done = true; burst();
      chip.className = 'chip msg';
      chip.innerHTML = 'Red etmiş olsan da<br>çabalamaya devam edicem';
    }
  });

  document.getElementById('go').addEventListener('click', () => {
    on = false;
    document.getElementById('prop').style.display = 'contents';
    const it = document.getElementById('intro');
    it.classList.add('out');
    setTimeout(() => it.style.display = 'none', 450);
  });
})();
</script>
</body>
</html>
